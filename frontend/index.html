<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina — Shielded Pool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Node-globals polyfill for browser bundles that still reference
         `global`, `process`, `Buffer` (some wallet kits / crypto libs). -->
    <script>
      window.global = window.global || window;
      window.process = window.process || { env: {}, browser: true, version: '' };
      window.Buffer = window.Buffer || (function () {
        var b = {};
        b.isBuffer = function () { return false; };
        return b;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
